[project]
name = "platoon-fanoutqa"
version = "0.1.0"
description = "Platoon integration for the official FanOutQA benchmark."
requires-python = "~=3.12.0"
dependencies = [
    "platoon >= 0.1.0",
    "fanoutqa[eval] == 1.3.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.11.9",
]

[tool.uv]
override-dependencies = [
    "fastapi[standard]>=0.115.0",
    "openai==1.99.6",
    "xgrammar==0.1.24",
    "outlines-core==0.1.26",
    "pyarrow==20.0.0",
    "datasets==4.3.0",
    "litellm==1.93.0",
    "kani==1.7.0",
    "networkx==3.3.0",
]

[tool.uv.sources]
platoon = { path = "../..", editable = true }
fanoutqa = { git = "https://github.com/zhudotexe/fanoutqa.git", rev = "989f4c40d9deea1ecb0897d7a17a9c0fe20d5c33" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platoon"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
