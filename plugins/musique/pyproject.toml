[project]
name = "platoon-musique"
version = "0.1.0"
description = "MuSiQue multi-hop QA inference plugin for Platoon."
requires-python = "~=3.12.0"
dependencies = [
    "platoon >= 0.1.0",
    "datasets >= 4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platoon"]

[tool.uv]
override-dependencies = [
    "fastapi[standard]>=0.115.0",
    "openai==1.99.6",
    "xgrammar==0.1.24",
    "outlines-core==0.1.26",
    "pyarrow==20.0.0",
    "datasets==4.3.0",
    "litellm==1.93.0",
    "networkx==3.3.0",
]

[tool.uv.sources]
platoon = { path = "../..", editable = true }

[tool.ruff]
line-length = 120
select = ["E", "F", "I"]
